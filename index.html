<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Askesis</title>
  <meta name="description" content="Stoisches Training mit dem eigenen Körpergewicht: Plan, Gewohnheiten, Körperwerte und Auswertung.">
  <meta name="theme-color" content="#f3eee5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1816" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21h16M6 18h12M7 18V8M12 18V8M17 18V8M5 8h14L12 3 5 8z"/></svg>Askesis</span>
    <button id="sync-status" class="sync" type="button" title="Jetzt synchronisieren"></button>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <div id="rest" class="rest" hidden>
    <div class="rest-bar"><i></i></div>
    <span class="rest-label">Pause</span>
    <span class="rest-time" id="rest-time">1:30</span>
    <button type="button" class="link" id="rest-skip">Weiter</button>
  </div>

  <nav id="tabs" class="tabs" hidden>
    <a href="#heute" data-tab="heute">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>
      <span>Heute</span>
    </a>
    <a href="#training" data-tab="training">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>
      <span>Training</span>
    </a>
    <a href="#auswertung" data-tab="auswertung">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Auswertung</span>
    </a>
    <a href="#verlauf" data-tab="verlauf">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span>Verlauf</span>
    </a>
    <a href="#mehr" data-tab="mehr">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
      <span>Mehr</span>
    </a>
  </nav>
  <div id="tip" class="tip" role="tooltip" hidden></div>
</body>
</html>
